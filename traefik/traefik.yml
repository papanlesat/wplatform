# Optional Traefik static configuration
# Use this file for advanced configurations like DNS challenge
# Most configuration is done via docker-compose.yml command line arguments

certificatesResolvers:
  letsencrypt:
    acme:
      email: your-email@example.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
      caServer: https://acme-v02.api.letsencrypt.org/directory

  cloudflare:
    acme:
      email: your-email@example.com
      storage: /letsencrypt/acme-cloudflare.json
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 0
        resolvers:
          - "1.1.1.1"
          - "1.0.0.1"
      caServer: https://acme-v02.api.letsencrypt.org/directory

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: :443
    http:
      tls: true
      middlewares:
        - security-headers

http:
  middlewares:
    security-headers:
      headers:
        X-Frame-Options: DENY
        X-Content-Type-Options: nosniff
        X-XSS-Protection: 1; mode=block
        Referrer-Policy: no-referrer
        Permissions-Policy: interest-cohortimer
        Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none'

api:
  dashboard: true
  insecure: false

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    network: wp-public
    exposedByDefault: false

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log
  format: common

accessLog:
  filePath: /var/log/traefik/access.log
  format: common
