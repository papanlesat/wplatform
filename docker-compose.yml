version: '3.9'

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=wp-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_EMAIL:-your-email@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory"
    environment:
      - "CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL:-}"
      - "CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/certs:/letsencrypt
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - wp-public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: wp-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wpplatform_db
      POSTGRES_USER: wpplatform_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wpplatform_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - wp-public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpplatform_user -d wpplatform_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wp-platform-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://wpplatform_user:${DB_PASSWORD:-wpplatform_pass}@postgres:5432/wpplatform_db?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-24h}
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - SERVER_IP=${SERVER_IP:-127.0.0.1}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL:-}
      - TRAEFIK_EMAIL=${TRAEFIK_EMAIL:-your-email@example.com}
      - BACKUP_BASE_PATH=${BACKUP_BASE_PATH:-/var/backups/wp}
      - WORDPRESS_IMAGE=${WORDPRESS_IMAGE:-wordpress:6-php8.2-apache}
      - DNS_RESOLVER=${DNS_RESOLVER:-8.8.8.8}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BACKUP_BASE_PATH:-./backups}:${BACKUP_BASE_PATH:-/var/backups/wp}
    ports:
      - "8080:8080"
    networks:
      - wp-public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wp-public:
    external: true

volumes:
  postgres_data:
    driver: local
